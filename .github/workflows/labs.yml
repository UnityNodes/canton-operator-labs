name: labs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lab: ["01"]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the LocalNet images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Run lab ${{ matrix.lab }} end to end
        run: tests/e2e-lab${{ matrix.lab }}.sh
      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in canton splice postgres; do echo "== $c"; docker logs --tail 200 "$c" 2>&1 | tail -200; done
      - name: Clean up
        if: always()
        run: ./lab down || true
