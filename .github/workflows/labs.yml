name: labs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check the balance comparison
        run: tests/balance-kept.sh
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lab: ["01", "02"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Free disk space for the LocalNet images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Run lab ${{ matrix.lab }} end to end
        env:
          LABS_CPU_LIMITS: "0"
        run: tests/e2e-lab${{ matrix.lab }}.sh
      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker inspect splice --format '{{json .State.Health}}' || true
          for c in canton splice postgres; do echo "== $c"; docker logs --tail 200 "$c" 2>&1 | tail -200; done
      - name: Clean up
        if: always()
        run: ./lab down || true
