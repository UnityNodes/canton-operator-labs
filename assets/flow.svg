<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="250" viewBox="0 0 1240 250" role="img"><title>How a lab runs</title><desc>Four steps: setup starts LocalNet, break causes the incident, you fix it with the public docs, check proves it.</desc><rect width="1240" height="250" rx="20" fill="#0D1117"/><rect width="1240" height="250" rx="20" fill="url(#g)"/><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern></defs><rect x="0.5" y="0.5" width="1239" height="249" rx="19.5" fill="none" stroke="#30363D"/><rect x="40" y="40" width="240" height="170" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="72" cy="76" r="15" fill="#21262D"/><text x="72" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#E6EDF3">1</text><text x="100" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="16" font-weight="700" fill="#E6EDF3">./lab 01 setup</text><text x="64" y="128" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Starts LocalNet and puts the</text><text x="64" y="152" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">node in the state the lab</text><text x="64" y="176" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">begins from.</text><path d="M292 125.0h34m-8 -8l8 8l-8 8" fill="none" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="40" width="240" height="170" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="382" cy="76" r="15" fill="#21262D"/><text x="382" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#E6EDF3">2</text><text x="410" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="16" font-weight="700" fill="#E6EDF3">./lab 01 break</text><text x="374" y="128" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Causes the incident the way</text><text x="374" y="152" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">it happens in production.</text><text x="374" y="176" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E"></text><path d="M602 125.0h34m-8 -8l8 8l-8 8" fill="none" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="660" y="40" width="240" height="170" rx="14" fill="#0F2A2A" stroke="#2DD4BF" stroke-width="1.6"/><circle cx="692" cy="76" r="15" fill="#2DD4BF"/><text x="692" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0D1117">3</text><text x="720" y="82" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.6" fill="#2DD4BF">YOUR JOB</text><text x="684" y="128" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Find the cause and fix it with</text><text x="684" y="152" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">the public operator docs.</text><text x="684" y="176" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Hints open one at a time.</text><path d="M912 125.0h34m-8 -8l8 8l-8 8" fill="none" stroke="#8B949E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="970" y="40" width="240" height="170" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="1002" cy="76" r="15" fill="#21262D"/><text x="1002" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#E6EDF3">4</text><text x="1030" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="16" font-weight="700" fill="#E6EDF3">./lab 01 check</text><text x="994" y="128" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">Proves the node is really</text><text x="994" y="152" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">fixed and prints a result</text><text x="994" y="176" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E">line you can share.</text></svg>