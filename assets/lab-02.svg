<svg xmlns="http://www.w3.org/2000/svg" width="500" height="372" viewBox="0 0 500 372" role="img"><title>Lab 02: Traffic exhausted</title><desc>A maintenance change switches off traffic top-up. The app gets busy and the node stops accepting transactions, without saying why.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern></defs><rect width="500" height="372" rx="18" fill="#0D1117"/><rect width="500" height="372" rx="18" fill="url(#g)"/><rect x="0.5" y="0.5" width="499" height="371" rx="17.5" fill="none" stroke="#30363D"/><clipPath id="c"><rect width="500" height="372" rx="18"/></clipPath><rect x="0" y="0" width="6" height="372" fill="#2DD4BF" clip-path="url(#c)"/><text x="36" y="52" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2.2" fill="#2DD4BF">LAB 02</text><text x="36" y="92" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#E6EDF3">Traffic exhausted</text><text x="36" y="130" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">A maintenance change switches off traffic</text><text x="36" y="154" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">top-up. The app gets busy and the node stops</text><text x="36" y="178" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8B949E">accepting transactions, without saying why.</text><rect x="36" y="216" width="428" height="70" rx="10" fill="#161B22" stroke="#30363D"/><text x="52" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">wallet    </tspan><tspan fill="#F85149" font-weight="bold">HTTP 429</tspan></text><text x="52" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13" xml:space="preserve"><tspan fill="#8B949E">validator </tspan><tspan fill="#F85149" font-weight="bold">SEQUENCER_NOT_ENOUGH_TRAFFIC_CREDIT</tspan></text><rect x="36" y="310" width="112" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#30363D"/><text x="92.0" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#E6EDF3">about 20 min</text><rect x="158" y="310" width="108" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#30363D"/><text x="212.0" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#E6EDF3">3 docs pages</text><rect x="276" y="310" width="112" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#30363D"/><text x="332.0" y="330" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#E6EDF3">Splice 0.9.2</text></svg>